<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crew Time Tracker — Supervisor Dashboard</title>
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
  </head>
  <body>
    <div x-data="dashboardApp()" x-init="init()">
      <!-- sign-in gate -->
      <template x-if="authReady && !user">
        <div class="dash-sign-in">
          <div style="font-size: 1.4rem; font-weight: 700">
            Supervisor Dashboard
          </div>
          <p style="color: var(--color-text-muted)">
            Sign in with your own Google account.
          </p>
          <button
            class="btn btn-primary-blue"
            style="padding: 14px 24px"
            @click="signInAsAdmin()"
          >
            Sign in
          </button>
          <div class="error-banner" x-show="error" x-text="error"></div>
        </div>
      </template>

      <!-- signed in, but identity failed to load (whoAmI call errored) -->
      <template x-if="authReady && user && !identity && error">
        <div class="dash-sign-in">
          <div style="font-size: 1.2rem; font-weight: 700">
            Couldn't load your account
          </div>
          <div class="error-banner" x-text="error"></div>
          <button class="btn" @click="loadIdentity()">Retry</button>
          <button class="btn" @click="signOutAdmin()">Sign out</button>
        </div>
      </template>

      <!-- signed in with a rig account by mistake -->
      <template x-if="authReady && user && identity && identity.role === 'rig'">
        <div class="dash-sign-in">
          <div style="font-size: 1.2rem; font-weight: 700">
            This is a rig account
          </div>
          <p style="color: var(--color-text-muted)">
            This Google account is registered as a rig, not a supervisor. Use
            the cab tablet app instead, or sign into the dashboard with your own
            personal Google account.
          </p>
          <button class="btn" @click="signOutAdmin()">Sign out</button>
        </div>
      </template>

      <!-- signed in, has a supervisor invite link, not yet joined -->
      <template
        x-if="authReady && user && identity && identity.role === null && pendingInvite && pendingInvite.role === 'admin'"
      >
        <div class="dash-sign-in">
          <div style="font-size: 1.4rem; font-weight: 700">
            Join as a supervisor
          </div>
          <p style="color: var(--color-text-muted)">
            You're joining an existing crew's dashboard.
          </p>
          <button
            class="btn btn-primary-blue"
            style="padding: 14px 24px"
            @click="submitJoinAsAdmin()"
            :disabled="working"
          >
            Join
          </button>
          <div class="error-banner" x-show="error" x-text="error"></div>
        </div>
      </template>

      <!-- signed in, no invite link and no identity yet -- create a new group -->
      <template
        x-if="authReady && user && identity && identity.role === null && !(pendingInvite && pendingInvite.role === 'admin')"
      >
        <div class="dash-sign-in">
          <div style="font-size: 1.4rem; font-weight: 700">
            Create your crew
          </div>
          <p style="color: var(--color-text-muted)">
            Name your crew to get started. You'll become its first supervisor,
            and can invite rigs and other supervisors afterward.
          </p>
          <input
            type="text"
            placeholder="e.g. Giesbrecht Earthworks"
            x-model="createDraft.name"
            style="max-width: 320px"
          />
          <button
            class="btn btn-primary-blue"
            style="padding: 14px 24px"
            @click="submitCreateGroup()"
            :disabled="working"
          >
            Create crew
          </button>
          <div class="error-banner" x-show="error" x-text="error"></div>
          <button class="btn" style="margin-top: 8px" @click="signOutAdmin()">
            Sign out
          </button>
        </div>
      </template>

      <!-- superadmin: pick which group to act on -->
      <template
        x-if="authReady && user && identity && identity.role === 'superadmin' && !selectedGroupId"
      >
        <div class="dash">
          <div class="dash-topbar">
            <div style="font-weight: 700">Crew Time Tracker — superadmin</div>
            <div class="who">
              Signed in as
              <strong x-text="user.displayName || user.email"></strong>
              <button
                class="btn"
                style="display: inline-flex; padding: 6px 12px"
                @click="signOutAdmin()"
              >
                Sign out
              </button>
            </div>
          </div>
          <div class="dash-header"><h1>Choose a group</h1></div>
          <div class="panel">
            <template x-if="allGroups.length === 0">
              <div class="empty-state">No groups yet.</div>
            </template>
            <template x-for="g in allGroups" :key="g.id">
              <div
                class="job-approval-row"
                style="cursor: pointer"
                @click="selectGroup(g.id)"
              >
                <div class="title" x-text="g.name"></div>
                <div class="row-actions">
                  <span class="chevron">&#8250;</span>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- main dashboard: a group's own admin, or a superadmin who picked one -->
      <template x-if="authReady && user && effectiveGroupId">
        <div class="dash">
          <div class="dash-topbar">
            <div
              style="font-weight: 700"
              x-text="group ? group.name : 'Crew Time Tracker'"
            ></div>
            <div class="who">
              <template x-if="identity.role === 'superadmin'">
                <button
                  class="btn"
                  style="
                    display: inline-flex;
                    padding: 6px 12px;
                    margin-right: 8px;
                  "
                  @click="backToGroupPicker()"
                >
                  Switch group
                </button>
              </template>
              Signed in as
              <strong
                x-text="identity.name || user.displayName || user.email"
              ></strong>
              <button
                class="btn"
                style="display: inline-flex; padding: 6px 12px"
                @click="signOutAdmin()"
              >
                Sign out
              </button>
            </div>
          </div>

          <div class="error-banner" x-show="error" x-text="error"></div>

          <!-- group settings: invite links -->
          <template x-if="group">
            <div class="panel" style="margin-bottom: 20px">
              <div
                style="
                  padding: 16px 20px;
                  border-bottom: 1px solid var(--color-border);
                "
              >
                <div style="font-weight: 700">Invite links</div>
                <div
                  class="sub"
                  style="color: var(--color-text-muted); font-size: 0.9rem"
                >
                  Share these outside the app (text, email) to bring on new rigs
                  or supervisors.
                </div>
              </div>
              <div class="job-approval-row">
                <div>
                  <div class="title">Rig invite link</div>
                  <div class="meta">
                    Whoever opens this sets up a new tablet as a rig.
                  </div>
                </div>
                <div class="row-actions">
                  <button
                    class="btn"
                    @click="regenerateLink('rig')"
                    :disabled="working"
                  >
                    Regenerate
                  </button>
                  <button
                    class="btn btn-primary-blue"
                    @click="copyInviteLink('rig')"
                    x-text="linkCopiedFor === 'rig' ? 'Copied!' : 'Copy link'"
                  ></button>
                </div>
              </div>
              <div class="job-approval-row">
                <div>
                  <div class="title">Supervisor invite link</div>
                  <div class="meta">
                    Whoever opens this joins the dashboard as a supervisor.
                  </div>
                </div>
                <div class="row-actions">
                  <button
                    class="btn"
                    @click="regenerateLink('admin')"
                    :disabled="working"
                  >
                    Regenerate
                  </button>
                  <button
                    class="btn btn-primary-blue"
                    @click="copyInviteLink('admin')"
                    x-text="linkCopiedFor === 'admin' ? 'Copied!' : 'Copy link'"
                  ></button>
                </div>
              </div>
            </div>
          </template>

          <!-- needs-reassignment panel -->
          <template x-if="needsReassignmentEntries.length">
            <div
              class="panel"
              style="margin-bottom: 20px; border-color: var(--color-blue)"
            >
              <div
                style="
                  padding: 16px 20px;
                  border-bottom: 1px solid var(--color-border);
                "
              >
                <div style="font-weight: 700">Needs reassignment</div>
                <div
                  class="sub"
                  style="color: var(--color-text-muted); font-size: 0.9rem"
                >
                  Time logged against a rejected job — pick a replacement job
                  for each entry.
                </div>
              </div>
              <template
                x-for="entry in needsReassignmentEntries"
                :key="entry.id"
              >
                <div class="job-approval-row reassign-row">
                  <div>
                    <div
                      class="title"
                      x-text="rigLabel(entry.rigId) + ' · ' + entry.date"
                    ></div>
                    <div
                      class="meta"
                      x-text="'Was: ' + (jobById(entry.jobId) ? jobLabel(jobById(entry.jobId)) : entry.jobId)"
                    ></div>
                  </div>
                  <div class="row-actions">
                    <select x-model="reassignTargets[entry.id]">
                      <option value="">Reassign to…</option>
                      <template x-for="job in approvedJobs" :key="job.id">
                        <option :value="job.id" x-text="jobLabel(job)"></option>
                      </template>
                    </select>
                    <button
                      class="btn btn-approve"
                      @click="submitReassign(entry)"
                      :disabled="!reassignTargets[entry.id]"
                    >
                      Save
                    </button>
                  </div>
                </div>
              </template>
            </div>
          </template>

          <div class="dash-header">
            <div>
              <h1>Job approvals</h1>
              <div class="sub" x-text="pendingJobs.length + ' pending'"></div>
            </div>
            <div class="tabs">
              <button
                :class="{ active: activeTab === 'pending' }"
                @click="activeTab = 'pending'"
              >
                Pending
              </button>
              <button
                :class="{ active: activeTab === 'all' }"
                @click="activeTab = 'all'"
              >
                All jobs
              </button>
            </div>
          </div>

          <div class="panel">
            <template x-if="jobsForTab.length === 0">
              <div class="empty-state">Nothing here.</div>
            </template>
            <template x-for="job in jobsForTab" :key="job.id">
              <div class="job-approval-row">
                <div>
                  <div class="title" x-text="jobLabel(job)"></div>
                  <div class="meta">
                    <span
                      x-text="'Created by ' + job.createdByOperatorName"
                    ></span>
                    <span x-text="' · ' + rigLabel(job.createdByRigId)"></span>
                    <span x-text="' · ' + jobTimeAgo(job)"></span>
                    <template x-if="activeTab === 'all'">
                      <span x-text="' · ' + job.status"></span>
                    </template>
                  </div>
                  <template
                    x-if="job.status === 'pending' && hoursByJob[job.id] > 0"
                  >
                    <div
                      class="hours-flag"
                      x-text="hoursByJob[job.id].toFixed(1) + ' hrs already logged against this job'"
                    ></div>
                  </template>
                </div>
                <template x-if="job.status === 'pending'">
                  <div class="row-actions">
                    <button class="btn btn-reject" @click="reject(job)">
                      Reject
                    </button>
                    <button class="btn btn-approve" @click="approve(job)">
                      Approve
                    </button>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </div>
      </template>
    </div>

    <script type="module" src="js/dashboard.js"></script>
    <script
      defer
      src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
  </body>
</html>
